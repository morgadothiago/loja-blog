services:
  db:
    image: postgres:17-alpine
    container_name: loja-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
      POSTGRES_DB: loja_blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja_blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
